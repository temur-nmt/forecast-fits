spring.application.name=forecast-fits-backend
spring.config.import=optional:file:../.env[.properties]

# connect to mysql database
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT}/forecast-fits-db
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
# update will automatically generate tables on build, for more security use validate and define schema
spring.jpa.hibernate.ddl.auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#jwt secret key
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000