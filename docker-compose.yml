services:

  db:
    image: mysql
    container_name: forecast-fits-db
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: forecast-fits-db
    volumes:
      - mysql_data:/var/lib/mysql/
    networks:
      - mysql_network
  
volumes:
  mysql_data:

networks:
  mysql_network: